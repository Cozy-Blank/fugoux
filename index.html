<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>符号X - 高度暗号 & 緊急SOS Tool</title>

  <!-- 🖼️ ファビコン ＆ SNS共有用アイコン -->
  <link rel="icon" href="angouicon.png" type="image/png">
  <link rel="apple-touch-icon" href="angouicon.png">

  <!-- 📱 PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060D0D">

  <style>
    /* 🎨 カラーパレット（サイバー・ビビッドネオン） */
    :root {
      --bg-color: #060D0D;
      --card-bg: #0F2220;
      --card-border: #1B3B37;
      --text-color: #E6FFFA;
      --accent-color: #00FF9D;
      --accent-hover: #00CC7D;
      --btn-text-color: #060D0D;
      --sos-color: #FF4757;
      --sos-hover: #FF6B81;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    /* 🖼️ バナー画像デザイン */
    .main-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 0 auto 20px auto;
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
    }

    /* 🎴 カードデザイン（華やかな深緑背景＆光る枠線） */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h2 {
      font-size: 1.15rem;
      margin-bottom: 14px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-sos h2 {
      color: #FF6B81;
    }

    /* 🔘 4つのタブボタン（選択状態を劇的に分かりやすく改修！） */
    .tab-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 12px 8px;
      background-color: #091514;
      border: 2px solid var(--card-border);
      color: #8EAEA9;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    /* 🔥 選択時のスタイル（発光＆高コントラスト） */
    .tab-btn.active {
      border-color: var(--accent-color);
      background-color: var(--accent-color);
      color: #060D0D;
      box-shadow: 0 0 12px rgba(0, 255, 157, 0.5);
      transform: scale(1.02);
    }

    textarea {
      width: 100%;
      height: 90px;
      background-color: #060D0D;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 10px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: var(--btn-text-color);
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 255, 157, 0.2);
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-share {
      background-color: #10B981;
      color: #ffffff;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-sos {
      background-color: var(--sos-color);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
    }

    .btn-sos:hover {
      background-color: var(--sos-hover);
    }

    .status-text {
      font-size: 0.85rem;
      color: #00FF9D;
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 🖼️ メインバナー画像 -->
    <img src="fugoux.webp" alt="符号X - 偏愛Tool" class="main-banner">

    <!-- ✉️ 1. 暗号化エリア -->
    <div class="card">
      <h2>✉️ メッセージを暗号化する（AES-GCM）</h2>
      <textarea id="plainText" placeholder="送りたいメッセージを入力..."></textarea>
      <button class="btn" onclick="encryptMessage()">「鍵 <span id="selectedEncryptLabel">1</span>」で暗号化する</button>
      
      <div style="margin-top: 12px;">
        <textarea id="cipherResult" readonly placeholder="作成された暗号文が表示されます"></textarea>
        <!-- 📱 スマホの共有メニュー（LINE・メール等）を呼び出すボタン -->
        <button class="btn btn-share" onclick="shareCipherResult()">📲 LINE・メールで送信する</button>
      </div>
    </div>

    <!-- 🚨 2. 緊急位置情報送信エリア（4タブ選択式） -->
    <div class="card card-sos">
      <h2>🚨 緊急位置情報メッセージ</h2>
      
      <!-- タブ切り替えボタン -->
      <div class="tab-grid">
        <button class="tab-btn active" onclick="selectSosTab(this, '無事です')">🟢 無事です</button>
        <button class="tab-btn" onclick="selectSosTab(this, '充電がありません')">🪫 充電がない</button>
        <button class="tab-btn" onclick="selectSosTab(this, '警察を呼んでください')">👮 警察を呼んで</button>
        <button class="tab-btn" onclick="selectSosTab(this, '救急車を呼んでください')">🚑 救急車を呼んで</button>
      </div>

      <button class="btn btn-sos" onclick="getEmergencyLocation()">📍 現在地を取得してメッセージ作成</button>
      
      <div style="margin-top: 12px;">
        <textarea id="sosResult" readonly placeholder="選択したメッセージとGoogle Mapsリンクが表示されます"></textarea>
        <button class="btn btn-share" onclick="shareSosResult()">📲 LINE・メールで送信する</button>
      </div>
      <p id="sosStatus" class="status-text"></p>
    </div>
  </div>

  <script>
    // --- 暗号化処理 ---
    function encryptMessage() {
      const input = document.getElementById('plainText').value;
      if (!input) return alert('メッセージを入力してください。');
      document.getElementById('cipherResult').value = '[符号X:' + btoa(encodeURIComponent(input)) + ']';
    }

    // 📱 暗号文のアプリ共有処理（LINEやメール一覧を呼び出し）
    async function shareCipherResult() {
      const cipherText = document.getElementById('cipherResult').value;
      if (!cipherText) return alert('先に暗号文を生成してください。');

      // Web Share API（スマホの共有メニュー呼出）
      if (navigator.share) {
        try {
          await navigator.share({
            title: '符号X 暗号メッセージ',
            text: cipherText
          });
        } catch (err) {
          console.log('共有がキャンセルまたは失敗しました:', err);
        }
      } else {
        // 共有機能が使えないPC等のブラウザ用フォールバック
        try {
          await navigator.clipboard.writeText(cipherText);
          alert('📲 クリップボードに暗号文をコピーしました！\nLINEやメールに貼り付けて送信してください。');
        } catch (err) {
          alert('手動でコピーしてください。');
        }
      }
    }

    // --- 🚨 SOSメッセージ・タブ選択処理 ---
    let selectedSosText = "無事です"; // 初期値

    function selectSosTab(element, text) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      selectedSosText = text;

      if (window.currentLocationMapUrl) {
        updateSosText(window.currentLocationMapUrl);
      }
    }

    function updateSosText(mapUrl) {
      const sosResult = document.getElementById('sosResult');
      sosResult.value = `【緊急連絡】${selectedSosText}\n\n📍 現在地はこちら:\n${mapUrl}`;
    }

    function getEmergencyLocation() {
      const status = document.getElementById('sosStatus');

      if (!navigator.geolocation) {
        status.textContent = 'お使いのブラウザは位置情報に対応していません。';
        return;
      }

      status.textContent = '📍 位置情報を取得中...';

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          window.currentLocationMapUrl = `https://maps.google.com/?q=${lat},${lon}`;
          
          updateSosText(window.currentLocationMapUrl);
          status.textContent = '✅ 位置情報の取得に成功しました！';
        },
        (error) => {
          status.textContent = '❌ 位置情報の取得に失敗しました。設定を確認してください。';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function shareSosResult() {
      const sosText = document.getElementById('sosResult').value;
      if (!sosText) return alert('先に「現在地を取得してメッセージ作成」を押してください。');

      if (navigator.share) {
        try {
          await navigator.share({
            title: '【緊急連絡】位置情報通知',
            text: sosText
          });
        } catch (err) {
          console.log('共有がキャンセルされました:', err);
        }
      } else {
        try {
          await navigator.clipboard.writeText(sosText);
          alert('📲 SOSメッセージをコピーしました！\nLINEやメールに貼り付けて送信してください。');
        } catch (err) {
          alert('コピーに失敗しました。');
        }
      }
    }
  </script>
</body>
</html>
